<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ashokie's Workspace</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #101525;
        color: #f7f8ff;
      }

      body::before,
      body::after {
        content: "";
        position: fixed;
        width: 32rem;
        height: 32rem;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.42;
      }

      body::before { background: #6c63ff; top: -13rem; left: -10rem; }
      body::after { background: #10b981; right: -12rem; bottom: -15rem; }

      main {
        position: relative;
        width: min(90%, 720px);
        padding: clamp(2.5rem, 8vw, 5.5rem) 2rem;
        text-align: center;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 28px;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(14px);
      }

      .eyebrow {
        margin: 0 0 1.25rem;
        color: #9ff1d4;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 5.25rem);
        line-height: 1.04;
        letter-spacing: -0.055em;
      }

      p:last-child {
        max-width: 38ch;
        margin: 1.5rem auto 0;
        color: #c7ccdf;
        font-size: clamp(1rem, 2vw, 1.18rem);
        line-height: 1.65;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Your creative corner</p>
      <h1>Welcome to Ashokie's Workspace</h1>
      <p>A calm place for ideas, projects, and everything you’re building next.</p>
    </main>
  </body>
</html>
